# 社区版使用独立安装目录的 ./data；不要与其它实例共用数据目录。
services:
  tradis-community:
    image: ${TRADIS_COMMUNITY_IMAGE:-ghcr.io/coracoo/tradis_docker:latest}
    # Compose 优先拉取镜像，镜像不可用时从本地完整源码构建。
    build:
      context: .
      dockerfile: Dockerfile.community
      args:
        CLIENT_VERSION: v0.9.8 # x-release-please-version
    container_name: tradis-community
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      BACKEND_PORT: ${TRADIS_PORT:-8080}
      # 生产默认 release：未提供 ADMIN_PASSWORD 时后端直接拒绝启动，不回落开发默认口令。
      GIN_MODE: ${GIN_MODE:-release}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 设置 JWT_SECRET（至少 32 字符随机值）}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 设置管理员初始密码}
      PROJECT_ROOT: ${PROJECT_ROOT:?请在 .env 中配置宿主机 Compose 项目绝对路径}
      APPSTORE_CDN_URL: ${APPSTORE_CDN_URL:-https://github.com/coracoo/tradis_templates}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      CLOUDFLARE_SPEED_TEST: ${CLOUDFLARE_SPEED_TEST:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/app/client/backend/data
      - ${PROJECT_ROOT:?请在 .env 中配置宿主机 Compose 项目绝对路径}:${PROJECT_ROOT:?请在 .env 中配置宿主机 Compose 项目绝对路径}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 $$BACKEND_PORT"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
