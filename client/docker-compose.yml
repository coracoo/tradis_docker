# 默认安装完整版镜像。
# 社区版请使用 docker-compose.community.yml，两个版本使用独立安装目录。
services:
  tradis:
    image: coracoo/tradis:latest
    container_name: tradis
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      BACKEND_PORT: ${TRADIS_PORT:-8080}
      GIN_MODE: release
      JWT_SECRET: ${JWT_SECRET:?请设置至少 32 字符的随机密钥}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请设置管理员初始密码}
      PROJECT_ROOT: ${PROJECT_ROOT:?请设置宿主机项目绝对路径}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      CLOUDFLARE_SPEED_TEST: ${CLOUDFLARE_SPEED_TEST:-false}
      # 仅在启用远程设备时设置监听地址和可被 Agent 访问的地址。
      TRADIS_REMOTE_AGENT_BIND: ${TRADIS_REMOTE_AGENT_BIND:-}
      TRADIS_REMOTE_AGENT_PUBLIC_URL: ${TRADIS_REMOTE_AGENT_PUBLIC_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/app/client/backend/data
      - ${PROJECT_ROOT:?请设置宿主机项目绝对路径}:${PROJECT_ROOT:?请设置宿主机项目绝对路径}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 $$BACKEND_PORT"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
